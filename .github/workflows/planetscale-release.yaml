name: PlanetScale image release

run-name: Publish ${{ inputs.source_ref }} to GHCR

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'planetscale/karpenter-provider-gcp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Resolve source
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha::7}"
          version="$(git describe --tags --always | sed 's/^v//')"
          tags="sha-${source_sha}"

          # Add a <ref>-<short-sha> tag unless the input was itself a commit SHA.
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-f]{7,40}$ || "${source_sha}" != "${SOURCE_REF}"* ]]; then
            ref="${SOURCE_REF#refs/heads/}"
            ref="${ref#refs/tags/}"
            # Docker tags allow [a-z0-9._-], must start with [a-z0-9_], and max out at 128 chars.
            ref="$(printf '%s' "${ref}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+//')"
            ref="${ref:0:$((128 - 1 - ${#short_sha}))}"
            ref="$(printf '%s' "${ref}" | sed -E 's/[.-]+$//')"
            if [[ -n "${ref}" ]]; then
              tags="${tags},${ref}-${short_sha}"
            fi
          fi

          {
            echo "sha=${source_sha}"
            echo "tags=${tags}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish image
        id: publish
        shell: bash
        env:
          KO_DOCKER_REPO: ghcr.io/planetscale/karpenter-provider-gcp
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_TAGS: ${{ steps.source.outputs.tags }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          image_ref="$(
            GOFLAGS='' ko build \
              --bare \
              --platform linux/amd64,linux/arm64 \
              --tags "${IMAGE_TAGS}" \
              --ldflags "-X=sigs.k8s.io/karpenter/pkg/operator.Version=${VERSION}" \
              github.com/cloudpilot-ai/karpenter-provider-gcp/cmd/controller
          )"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Published image'
            echo
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Image: \`${image_ref}\`"
            echo "- Tags: \`${IMAGE_TAGS}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
